name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate plugins
        run: |
          for p in plugins/*/; do
            echo "::group::$p"
            claude plugin validate "./$p"
            echo "::endgroup::"
          done
      - name: Check agents and workflow agents pin model and effort
        run: |
          fail=0
          for f in plugins/*/agents/*.md; do
            for k in model effort; do
              grep -q "^$k: " "$f" || { echo "::error file=$f::agent frontmatter has no $k"; fail=1; }
            done
          done
          # agent() options are one-line `{ label: ... }` literals; each needs an agentType or a model and an effort.
          grep -n "{ label:" plugins/*/workflows/*.js | grep -v "agentType:" \
            | grep -v "model: .*effort: " \
            | awk -F: '{ print "::error file=" $1 ",line=" $2 "::agent() call without agentType sets no model and effort"; bad = 1 } END { exit bad }' \
            || fail=1
          exit $fail
      - name: Check shell scripts parse
        run: |
          git ls-files '*.sh' | while read -r f; do
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; exit 1; }
          done
