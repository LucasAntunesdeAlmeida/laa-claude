name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate plugins
        run: |
          for p in plugins/*/; do
            echo "::group::$p"
            claude plugin validate "./$p"
            echo "::endgroup::"
          done
      - name: Check shell scripts parse
        run: |
          git ls-files '*.sh' | while read -r f; do
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; exit 1; }
          done
