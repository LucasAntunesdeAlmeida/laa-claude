name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # v7 of both run on Node 24; the runners removed Node 20, which v4 ran on.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate plugins
        run: |
          for p in plugins/*/; do
            echo "::group::$p"
            claude plugin validate "./$p"
            echo "::endgroup::"
          done
      - name: Check agents and workflow agents pin model, effort, and color
        run: |
          fail=0
          for f in plugins/*/agents/*.md; do
            for k in model effort; do
              grep -q "^$k: " "$f" || { echo "::error file=$f::agent frontmatter has no $k"; fail=1; }
            done
            # Colors mark the agent's role family (see plugins/laa/skills/forge/references/templates.md); these are the eight Claude Code accepts.
            grep -Eq '^color: (red|blue|green|yellow|purple|orange|pink|cyan)$' "$f" || { echo "::error file=$f::agent frontmatter needs color: red, blue, green, yellow, purple, orange, pink, or cyan"; fail=1; }
          done
          # agent() options are one-line `{ label: ... }` literals; each needs an agentType or a model and an effort.
          grep -n "{ label:" plugins/*/workflows/*.js | grep -v "agentType:" \
            | grep -v "model: .*effort: " \
            | awk -F: '{ print "::error file=" $1 ",line=" $2 "::agent() call without agentType sets no model and effort"; bad = 1 } END { exit bad }' \
            || fail=1
          exit $fail
      - name: Check shell scripts parse
        run: |
          git ls-files '*.sh' | while read -r f; do
            sh -n "$f" || { echo "::error file=$f::sh -n failed"; exit 1; }
          done
      - name: Test hook scripts
        run: |
          for t in plugins/*/scripts/tests/*.test.sh; do
            sh "$t" || { echo "::error file=$t::hook test failed"; exit 1; }
          done
      - name: Test mods
        run: claude plugin test ./plugins/laa-mods
      - name: Type-check mods
        run: |
          # tsc reads the engine's declarations from .claude-plugin/types/claude-code/index.d.ts (tsconfig.json
          # includes .claude-plugin/types). A local session writes them there; CI takes the published copy.
          types=plugins/laa-mods/.claude-plugin/types/claude-code
          mkdir -p "$types"
          curl -fsSL https://raw.githubusercontent.com/anthropics/claude-code/main/mods/types/claude-code.d.ts -o "$types/index.d.ts" \
            || { echo "::error file=plugins/laa-mods/tsconfig.json::could not download the mod types"; exit 1; }
          grep -q "declare module 'claude-code'" "$types/index.d.ts" \
            || { echo "::error file=plugins/laa-mods/tsconfig.json::the downloaded mod types declare no 'claude-code' module"; exit 1; }
          npx -y -p typescript tsc -p plugins/laa-mods
      - name: Test workflow reports
        run: node --test "plugins/laa/tests/*.test.mjs"
      - name: Check /laa-help lists every laa skill
        run: |
          for d in plugins/laa/skills/*/; do
            s=$(basename "$d")
            grep -q "'/laa:$s" plugins/laa-mods/hooks/git.ts \
              || { echo "::error file=plugins/laa-mods/hooks/git.ts::/laa-help (HELP) doesn't list /laa:$s"; exit 1; }
          done
      - name: Check shared skill sections match
        run: |
          # CLAUDE.md: every skill that calls a workflow keeps the same "Running the workflows" section.
          first=""
          for f in plugins/laa/skills/*/SKILL.md; do
            section=$(awk '/^## Running the workflows/{p=1;next} p&&/^## /{exit} p' "$f")
            [ -n "$section" ] || continue
            if [ -z "$first" ]; then
              first=$f
              ref=$section
            elif [ "$section" != "$ref" ]; then
              echo "::error file=$f::'Running the workflows' differs from $first"
              exit 1
            fi
          done
